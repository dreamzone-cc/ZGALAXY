openapi: 3.0.3
info:
  title: ZGalaxy - Planet & Moon Infrastructure Management API
  description: |
    ZGalaxy Planet & Moon Infrastructure Engine API. Manages self-hosted ZeroTier
    Planet/Moon infrastructure: authentication & RBAC, planet/moon building,
    federation mesh, cluster HA, Cloudflare DNS/DDNS, identity, and encrypted backup.
  version: 1.3.0
servers:
  - url: http://localhost:3000
    description: Local ZGalaxy server
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
    Session:
      type: object
      properties:
        token:
          type: string
        username:
          type: string
        role:
          type: string
          enum: [ADMIN, OPERATOR, READ_ONLY]
        createdAt:
          type: string
          format: date-time
paths:
  # ================= SYSTEM =================
  /api/v1/health:
    get:
      summary: Health check (public)
      security: []
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
  /api/v1/metrics:
    get:
      summary: Runtime metrics (Prometheus text format)
      responses:
        '200':
          description: Metrics payload
          content:
            text/plain:
              schema:
                type: string
  /api/v1/ready:
    get:
      summary: Readiness probe reflecting real ZeroTier infrastructure state
      responses:
        '200':
          description: Ready (identity + auth token present)
        '503':
          description: Not ready (missing identity/auth token)

  # ================= AUTH & USERS =================
  /api/v1/auth/login:
    post:
      summary: Authenticate and obtain a bearer session token (public)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Session token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/schemas/Error'
        '429':
          description: Rate limited
  /api/v1/auth/logout:
    post:
      summary: Invalidate the current session token
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logged out
  /api/v1/auth/me:
    get:
      summary: Current authenticated user profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile
  /api/v1/auth/users:
    get:
      summary: List users (ADMIN only)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of users without hashes
        '403':
          $ref: '#/components/schemas/Error'
  /api/v1/auth/users/create:
    post:
      summary: Create a user (ADMIN only)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, role]
              properties:
                username: { type: string }
                password:
                  type: string
                  minLength: 8
                role:
                  type: string
                  enum: [ADMIN, OPERATOR, READ_ONLY]
      responses:
        '201':
          description: User created
        '400':
          $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/schemas/Error'
  /api/v1/auth/users/{username}:
    delete:
      summary: Delete a user (ADMIN only; `admin` is protected)
      security:
        - BearerAuth: []
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: User deleted
        '400':
          $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/schemas/Error'

  # ================= PLANET =================
  /api/v1/planet/info:
    get:
      summary: Read current Planet state
      responses:
        '200':
          description: Planet info
  /api/v1/planet/download:
    get:
      summary: Download the planet binary (public, required by ZeroTier clients)
      security: []
      responses:
        '200':
          description: Binary planet file
  /api/v1/planet/build:
    post:
      summary: Build a Planet with IPv4/IPv6/domain endpoints
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ip4: { type: string }
                ip6: { type: string }
                domain: { type: string }
                port: { type: integer }
      responses:
        '200':
          description: Planet built
        '403':
          $ref: '#/components/schemas/Error'
  /api/v1/planet/regenerate:
    post:
      summary: Rebuild the Planet from current endpoints
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Planet rebuilt
        '403':
          $ref: '#/components/schemas/Error'
  /api/v1/planet/validate:
    post:
      summary: Validate planet file integrity (size + SHA-256)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Validation result
        '403':
          $ref: '#/components/schemas/Error'
  /api/v1/planet:
    delete:
      summary: Delete the planet file (unlinks; ADMIN only)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Planet deleted
        '403':
          $ref: '#/components/schemas/Error'
  /api/v1/planet/templates:
    get:
      summary: List Planet build templates
      responses:
        '200':
          description: Templates

  # ================= MOONS =================
  /api/v1/moons:
    get:
      summary: List moons
      responses:
        '200':
          description: List of moons
  /api/v1/moons/create:
    post:
      summary: Create a signed Moon
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoints]
              properties:
                name: { type: string }
                endpoints:
                  type: array
                  items: { type: string }
      responses:
        '201':
          description: Moon created
        '403':
          $ref: '#/components/schemas/Error'
  /api/v1/moons/{id}:
    put:
      summary: Update a moon's endpoints
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Moon updated
        '403':
          $ref: '#/components/schemas/Error'
    delete:
      summary: Delete a moon file (ADMIN only)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Moon deleted
        '400':
          description: Invalid moon identifier (path traversal rejected)
        '403':
          $ref: '#/components/schemas/Error'
  /api/v1/moons/{id}/migrate:
    post:
      summary: Migrate a moon to a target planet (identity-preserving)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetPlanetId]
              properties:
                targetPlanetId: { type: string }
      responses:
        '200':
          description: Moon migrated
        '403':
          $ref: '#/components/schemas/Error'
  /api/v1/moons/{id}/rebind:
    post:
      summary: Rebind a moon's endpoints
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoints]
              properties:
                endpoints:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Moon rebound
        '403':
          $ref: '#/components/schemas/Error'
  /api/v1/moons/{id}/rebuild:
    post:
      summary: Rebuild a moon's signed file
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Moon rebuilt
        '403':
          $ref: '#/components/schemas/Error'
  /api/v1/moons/{id}/download:
    get:
      summary: Download a moon file (authenticated)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Binary .moon file
        '400':
          description: Invalid moon identifier
  /api/v1/moons/ha-templates:
    get:
      summary: List HA moon templates
      responses:
        '200':
          description: Templates

  # ================= CLUSTER / HA =================
  /api/v1/cluster/status:
    get:
      summary: Cluster topology and health
      responses:
        '200':
          description: Topology (syncSecret is never returned)
  /api/v1/cluster/nodes/add:
    post:
      summary: Add a cluster node
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nodeId, ip4]
              properties:
                nodeId: { type: string }
                name: { type: string }
                ip4: { type: string }
                ip6: { type: string }
                domain: { type: string }
                port: { type: integer }
                isLocal: { type: boolean }
      responses:
        '200':
          description: Node added
        '403':
          $ref: '#/components/schemas/Error'
  /api/v1/cluster/nodes/{nodeId}:
    delete:
      summary: Remove a cluster node
      security:
        - BearerAuth: []
      parameters:
        - name: nodeId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Node removed
        '403':
          $ref: '#/components/schemas/Error'
  /api/v1/cluster/sync:
    post:
      summary: Re-probe node health (real checks) and sync topology
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Synced topology with honest ONLINE/OFFLINE status
        '403':
          $ref: '#/components/schemas/Error'
  /api/v1/cluster/build-unified:
    post:
      summary: Build a multi-root unified Planet from all ONLINE nodes
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Multi-root planet built
        '403':
          $ref: '#/components/schemas/Error'

  # ================= FEDERATION =================
  /api/v1/federation/handshake:
    post:
      summary: Inter-node handshake (public; token-gated, rate limited, anti-poisoning)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceNodeId, sourceEndpoint, tokenSecret]
              properties:
                sourceNodeId: { type: string }
                sourceNodeName: { type: string }
                sourceEndpoint: { type: string }
                tokenSecret: { type: string }
                requestedSyncMode:
                  type: string
                  enum: [FEDERATION_INHERITED, DIRECT_ISOLATED]
      responses:
        '200':
          description: Handshake accepted
        '400':
          $ref: '#/components/schemas/Error'
        '429':
          description: Rate limited
  /api/v1/federation/tokens:
    get:
      summary: List federation tokens (secrets masked)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Token list with tokenSecretMasked only
        '403':
          $ref: '#/components/schemas/Error'
  /api/v1/federation/tokens/create:
    post:
      summary: Create a federation token (secret shown once)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                syncMode:
                  type: string
                  enum: [FEDERATION_INHERITED, DIRECT_ISOLATED]
                permissions:
                  type: array
                  items:
                    type: string
                    enum: [READ, WRITE, PLANET_SYNC, MOON_SYNC]
                maxUses: { type: integer }
                expiresInDays: { type: integer }
      responses:
        '201':
          description: Token created
        '403':
          $ref: '#/components/schemas/Error'
  /api/v1/federation/tokens/{id}/revoke:
    post:
      summary: Revoke a federation token
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Token revoked
        '403':
          $ref: '#/components/schemas/Error'
  /api/v1/federation/tokens/{id}/renew:
    post:
      summary: Extend a federation token expiration
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                extensionDays: { type: integer }
      responses:
        '200':
          description: Token renewed
        '403':
          $ref: '#/components/schemas/Error'
  /api/v1/federation/join:
    post:
      summary: Join a remote federation node via token (SSRF-guarded)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetEndpoint, tokenSecret]
              properties:
                targetEndpoint: { type: string }
                tokenSecret: { type: string }
                syncMode:
                  type: string
                  enum: [FEDERATION_INHERITED, DIRECT_ISOLATED]
      responses:
        '200':
          description: Joined
        '400':
          description: Invalid/blocked target (SSRF protection)
        '403':
          $ref: '#/components/schemas/Error'
  /api/v1/federation/peers:
    get:
      summary: List connected peers and topology
      responses:
        '200':
          description: Peer topology
  /api/v1/federation/peers/{nodeId}:
    delete:
      summary: Disconnect a peer
      security:
        - BearerAuth: []
      parameters:
        - name: nodeId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Peer disconnected
        '404':
          $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/schemas/Error'
  /api/v1/federation/sync-now:
    post:
      summary: Trigger real mesh topology propagation (fan-out)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Propagation results
        '403':
          $ref: '#/components/schemas/Error'

  # ================= IDENTITY =================
  /api/v1/identity/status:
    get:
      summary: Identity & certificate status (honest checks)
      responses:
        '200':
          description: Identity status
  /api/v1/identity/generate:
    post:
      summary: Generate a new identity
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Identity generated
        '403':
          $ref: '#/components/schemas/Error'
  /api/v1/identity/rotate:
    post:
      summary: Rotate identity/certificates (ADMIN only)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Identity rotated
        '403':
          $ref: '#/components/schemas/Error'
  /api/v1/identity/verify:
    post:
      summary: Verify identity integrity (SHA-384 address derivation)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Verification result
        '403':
          $ref: '#/components/schemas/Error'

  # ================= BACKUP =================
  /api/v1/backup/export:
    post:
      summary: Export an AES-256-GCM encrypted backup (ADMIN only)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Encrypted archive path + SHA-256 of plaintext
        '403':
          $ref: '#/components/schemas/Error'
  /api/v1/backup/import:
    post:
      summary: Restore from an encrypted (or legacy plain) backup (ADMIN only)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tarPath]
              properties:
                tarPath: { type: string }
      responses:
        '200':
          description: Restore completed
        '403':
          $ref: '#/components/schemas/Error'

  # ================= CLOUDFLARE =================
  /api/v1/cloudflare/config:
    get:
      summary: Get Cloudflare configuration (apiToken masked)
      responses:
        '200':
          description: Config with apiTokenMasked / hasApiToken
    post:
      summary: Save Cloudflare configuration (ADMIN/OPERATOR)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                mode: { type: string }
                apiToken: { type: string }
                zoneId: { type: string }
                zoneName: { type: string }
                recordId: { type: string }
                recordName: { type: string }
                recordType: { type: string }
                proxied: { type: boolean }
                autoRebuildPlanet: { type: boolean }
      responses:
        '200':
          description: Config saved (masked)
        '403':
          $ref: '#/components/schemas/Error'
  /api/v1/cloudflare/verify-token:
    post:
      summary: Verify a Cloudflare API token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                apiToken: { type: string }
      responses:
        '200':
          description: Validation result
  /api/v1/cloudflare/zones:
    get:
      summary: List available Cloudflare zones
      responses:
        '200':
          description: Zones
  /api/v1/cloudflare/zones/{zoneId}/records:
    get:
      summary: List DNS records for a zone
      parameters:
        - name: zoneId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Records
  /api/v1/cloudflare/sync:
    post:
      summary: Trigger manual Cloudflare DNS synchronization (ADMIN/OPERATOR)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Sync result
        '403':
          $ref: '#/components/schemas/Error'
  /api/v1/cloudflare/logs:
    get:
      summary: Cloudflare sync history
      responses:
        '200':
          description: Logs
    delete:
      summary: Clear Cloudflare sync logs (ADMIN/OPERATOR)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logs cleared
        '403':
          $ref: '#/components/schemas/Error'

  # ================= NETWORK =================
  /api/v1/network/addresses:
    get:
      summary: Internal (LAN) and external (WAN) addresses
      responses:
        '200':
          description: Addresses

  # ================= DOMAINS =================
  /api/v1/domains:
    get:
      summary: List bound domains
      responses:
        '200':
          description: Domains
  /api/v1/domains/verify:
    post:
      summary: Verify a domain's DNS A/AAAA records
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain: { type: string }
      responses:
        '200':
          description: Verification result
  /api/v1/domains/bind:
    post:
      summary: Bind a domain to PLANET or MOON
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain: { type: string }
                target:
                  type: string
                  enum: [PLANET, MOON]
      responses:
        '200':
          description: Domain bound
        '403':
          $ref: '#/components/schemas/Error'

  # ================= DDNS =================
  /api/v1/ddns/status:
    get:
      summary: DDNS configuration and IP-tracking status
      responses:
        '200':
          description: DDNS status
  /api/v1/ddns/sync:
    post:
      summary: Force immediate DDNS sync (ADMIN/OPERATOR)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Sync result
        '403':
          $ref: '#/components/schemas/Error'
  /api/v1/ddns/config:
    post:
      summary: Update DDNS configuration (ADMIN/OPERATOR)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Config updated
        '403':
          $ref: '#/components/schemas/Error'
